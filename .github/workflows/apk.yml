name: Construir Jarvis Auto

on:
  push:
    branches: [main]
    paths-ignore:
      - "assinatura.b64"
      - "LEIAME.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    concurrency:
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preparar assinatura (cria uma vez e guarda no repositorio)
        run: |
          if [ ! -f assinatura.b64 ]; then
            keytool -genkeypair -keystore app/ja.jks -alias ja -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass ja2026pedro -keypass ja2026pedro -dname "CN=Jarvis Auto, O=Multibrico, C=AO"
            base64 -w0 app/ja.jks > assinatura.b64
            git config user.name "ja-bot"
            git config user.email "ja-bot@users.noreply.github.com"
            git add assinatura.b64
            git commit -m "Assinatura da app (criada uma vez)"
            git push
          else
            base64 -d assinatura.b64 > app/ja.jks
          fi
      - name: Construir APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk jarvis-auto.apk
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" jarvis-auto.apk --title "Jarvis Auto 1.0.${GITHUB_RUN_NUMBER}" --notes "Compilacao automatica" --latest
